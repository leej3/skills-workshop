name: workshop-cli-contract
skill: unix-cli-design
schemaVersion: '1.0'
version: '1.0'
config:
  trials_per_task: 2
  timeout_seconds: 120
  parallel: false
  executor: mock
  skill_directories:
    - ../../../.agents/skills/unix-cli-design
metrics:
  - name: task_completion
    weight: 1
    threshold: 0.5
graders:
  - type: code
    name: output-present
    config:
      assertions:
        - 'len(output) > 10'
tasks:
  - tasks/*.yaml
