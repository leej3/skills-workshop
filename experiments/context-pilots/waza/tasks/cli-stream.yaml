id: cli-stream-001
name: Review streaming CLI contract
inputs:
  prompt: |
    Review a CLI that emits one JSON object per input line. It prints progress to
    stdout, treats malformed lines as successes, and prints a Python traceback
    when piped to head. Propose the smallest compatible behavior changes and
    tests. State which guarantees a downstream pipeline can rely on.
expected:
  behavior:
    max_tool_calls: 8
