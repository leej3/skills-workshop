schema_version: 0.1.0
id: workshop-handoff-v1
record_type: rubric
use_case: workshop-small-team
version: 1.0.0
reference_bundle: stamped-2026-09-25
decided_by: assessor
decision_rationale: 'Priorities inferred from the user request and earlier decisions: portable durable
  evidence, replaceable tools, authorized sensitive access, few-person burst tolerance and modest
  operating effort. These priorities are provisional and not human-calibrated; normative MUST requirements
  remain visible regardless of priority.'
principles:
- category: self_contained
  priority: essential
  direction: maximize
  rationale: One versioned entrypoint resolves all essential code, evidence, environments and configuration
    roles. Assessor-inferred priority from the stated small-team use case; normative requirements
    remain unchanged.
- category: tracked
  priority: essential
  direction: preserve
  rationale: Every result identifies exact source bytes, inputs, collector and environment versions.
    Assessor-inferred priority from the stated small-team use case; normative requirements remain
    unchanged.
- category: actionable
  priority: essential
  direction: maximize
  rationale: An authorized recipient can execute documented collection and recovery procedures. Assessor-inferred
    priority from the stated small-team use case; normative requirements remain unchanged.
- category: modular
  priority: important
  direction: balance
  rationale: Canonical records, disposable projections and restricted artifacts have separate interfaces
    and routing. Assessor-inferred priority from the stated small-team use case; normative requirements
    remain unchanged.
- category: portable
  priority: essential
  direction: maximize
  rationale: The workflow reconstructs on a fresh supported host without undocumented author state.
    Assessor-inferred priority from the stated small-team use case; normative requirements remain
    unchanged.
- category: ephemeral
  priority: important
  direction: balance
  rationale: Execution environments and indexes can be discarded without losing durable evidence
    or pending work. Assessor-inferred priority from the stated small-team use case; normative requirements
    remain unchanged.
- category: distributable
  priority: essential
  direction: maximize
  rationale: An intended authorized recipient can retrieve exact essential components and restore
    the workflow. Assessor-inferred priority from the stated small-team use case; normative requirements
    remain unchanged.
criteria:
- id: workflow-self_contained
  category: self_contained
  question: Can one versioned entrypoint resolve every essential workflow component?
  target: One versioned entrypoint resolves all essential code, evidence, environments and configuration
    roles.
  required_activities:
  - inspect
  - independent_reproduce
  checklist_items:
  - stamped-checklist:must/002
  - stamped-checklist:must/003
  rationale: Assessor-selected use-case criterion. Mapped checklist items inform but do not exhaust
    the principle.
- id: workflow-tracked
  category: tracked
  question: Can exact inputs, executable source, environments and outputs be identified for each
    assessment?
  target: Every result identifies exact source bytes, inputs, collector and environment versions.
  required_activities:
  - inspect
  checklist_items:
  - stamped-checklist:must/004
  - stamped-checklist:must/005
  - stamped-checklist:must/006
  rationale: Assessor-selected use-case criterion. Mapped checklist items inform but do not exhaust
    the principle.
- id: workflow-actionable
  category: actionable
  question: Can an authorized recipient run collection and recovery from the documented procedure?
  target: An authorized recipient can execute documented collection and recovery procedures.
  required_activities:
  - inspect
  - execute
  checklist_items:
  - stamped-checklist:must/007
  - stamped-checklist:must/008
  - stamped-checklist:should/002
  rationale: Assessor-selected use-case criterion. Mapped checklist items inform but do not exhaust
    the principle.
- id: workflow-modular
  category: modular
  question: Are authoritative evidence, disposable indexes and restricted artifacts separated by
    clear interfaces?
  target: Canonical records, disposable projections and restricted artifacts have separate interfaces
    and routing.
  required_activities:
  - inspect
  - execute
  checklist_items:
  - stamped-checklist:should/003
  - stamped-checklist:should/009
  rationale: Assessor-selected use-case criterion. Mapped checklist items inform but do not exhaust
    the principle.
- id: workflow-portable
  category: portable
  question: Can another supported host reconstruct execution without undocumented author state?
  target: The workflow reconstructs on a fresh supported host without undocumented author state.
  required_activities:
  - inspect
  - independent_reproduce
  checklist_items:
  - stamped-checklist:must/009
  - stamped-checklist:must/010
  - stamped-checklist:must/011
  - stamped-checklist:must/012
  - stamped-checklist:must/013
  rationale: Assessor-selected use-case criterion. Mapped checklist items inform but do not exhaust
    the principle.
- id: workflow-ephemeral
  category: ephemeral
  question: Can execution environments and derived indexes be discarded and recreated while preserving
    evidence?
  target: Execution environments and indexes can be discarded without losing durable evidence or
    pending work.
  required_activities:
  - inspect
  - independent_reproduce
  checklist_items:
  - stamped-checklist:should/004
  - stamped-checklist:should/005
  rationale: Assessor-selected use-case criterion. Mapped checklist items inform but do not exhaust
    the principle.
- id: workflow-distributable
  category: distributable
  question: Can an intended authorized recipient retrieve exact essential bytes and operate independently?
  target: An intended authorized recipient can retrieve exact essential components and restore the
    workflow.
  required_activities:
  - inspect
  - independent_reproduce
  checklist_items:
  - stamped-checklist:must/015
  - stamped-checklist:must/016
  - stamped-checklist:must/017
  - stamped-checklist:should/006
  rationale: Assessor-selected use-case criterion. Mapped checklist items inform but do not exhaust
    the principle.
- id: workflow-economy
  category: actionable
  question: Does the added evidence workflow improve outcomes enough to justify its operating and
    review cost?
  target: Representative repeated comparisons establish quality and operating costs under matched
    conditions.
  required_activities:
  - inspect
  - compare
  checklist_items: []
  rationale: Assessor-selected use-case criterion. Additional operational optimization criterion,
    intentionally beyond checklist coverage.
