[workspace]
name = "skills-workshop"
version = "0.1.0"
description = "Track cross-project skill evidence and compose existing skill tools"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[dependencies]
python = ">=3.11,<3.14"
git = ">=2.40"
gh = ">=2.60"
ruff = ">=0.12"
textual = ">=6,<7"
visidata = ">=3.3,<4"
pytest = ">=8.4,<9"
pytest-asyncio = ">=1,<2"
nodejs = "22.*"
jsonschema = "4.*"
pyyaml = "6.*"
pre-commit = ">=4.6,<5"

[tasks]
workshop = "python scripts/workshop.py"
memory-validate = "python scripts/workshop.py validate"
inventory = "python scripts/inventory.py"
inventory-table = "python scripts/inventory.py --format tsv"
inventory-vd = { cmd = "vd inventory/skills.tsv", depends-on = ["inventory-table"] }
configure-upstreams = "python scripts/manage_skills.py configure-upstreams"
link-core = "python scripts/manage_skills.py link-core"
apply-bundle = "python scripts/manage_skills.py apply-bundle"
cleanup-backups = "python scripts/manage_skills.py cleanup-backups"
cleanup-backups-apply = "python scripts/manage_skills.py cleanup-backups --apply"
import-project = "python scripts/import_skills.py"
skill-status = "python scripts/skill_status.py"
upstream-status = "python scripts/upstream_status.py status"
upstream-update = "python scripts/upstream_status.py update"
trust-inventory = "python scripts/upstream_status.py trust"
trust-table = "python scripts/upstream_status.py trust --format tsv --output inventory/trust.tsv"
trust-vd = { cmd = "vd inventory/trust.tsv", depends-on = ["trust-table"] }
review-skill = "python scripts/upstream_status.py review"
migrate-metadata = "python scripts/migrate_metadata.py"
migrate-metadata-apply = "python scripts/migrate_metadata.py --apply"
validate-metadata = "python scripts/validate_metadata.py"
format = "ruff format scripts tests"
lint = "ruff check scripts tests"
check-format = "ruff format --check scripts tests"
compile = "python -m compileall -q scripts tests"
test = "pytest -q tests"
hooks-install = "pre-commit install"
validate = { depends-on = ["lint", "check-format", "compile", "test", "validate-metadata", "memory-validate"] }

[pypi-dependencies]
apm-cli = "==0.28.0"
